<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Marketplace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { padding: 16px 24px; border-bottom: 2px solid #1a4f8a; }
    main { padding: 24px; }
    .error-banner { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6c0;
      padding: 10px 14px; border-radius: 4px; margin: 12px 0; display: none; }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Campus Marketplace</h1>
    <nav id="nav"></nav>
  </header>
  <main>
    <div id="error-banner" class="error-banner" role="alert"></div>
    <section id="app">
      <h2>Products</h2>
      <div id="product-list" class="products"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
